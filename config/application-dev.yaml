spring:
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: true

secretpad:
  platform-type: CENTER    # CENTER  EDGE  AUTONOMY
  deploy-mode: ${DEPLOY_MODE:ALL-IN-ONE} # MPC TEE ALL-IN-ONE
  node-id: ${NODE_ID:kuscia-system} # install.sh -n
  gateway: ${KUSCIA_GW_ADDRESS:127.0.0.1:18301} # install.sh -q envoy port (used in autonomy or master or edge mode)
  logs:
    path: ../log
  auth:
    # 【仅本地开发】固定测试口令 admin/12345678（安全整改 P0-1 的显式 opt-in 例外，docs/secretpad_auth.md）。
    # 只在这个 profile 打开，方便 IDE 本地起服务后直接登录；生产 application.yaml 与 edge/p2p 部署
    # profile 都没有这一项，缺省即关闭（走随机口令 + 0600 文件下发）。
    fixed-test-password-enabled: true

kuscia:
  nodes:
    - domainId: ${NODE_ID:kuscia-system}
      mode: master
      host: ${KUSCIA_API_ADDRESS:root-kuscia-master}
      port: ${KUSCIA_API_PORT:18083}
      protocol: ${KUSCIA_PROTOCOL:tls}
      cert-file: config/certs/client.crt
      key-file: config/certs/client.pem
      ca-file: config/certs/ca.crt  # 受信 CA（P0-2：验证 Kuscia 服务端证书用，替代此前的 InsecureTrustManagerFactory）
      token: config/certs/token

    - domainId: alice
      mode: lite
      host: ${KUSCIA_API_ADDRESS:root-kuscia-lite-alice}
      port: ${KUSCIA_API_PORT:28083}
      protocol: ${KUSCIA_PROTOCOL:tls}
      cert-file: config/certs/alice/client.crt
      key-file: config/certs/alice/client.pem
      ca-file: config/certs/alice/ca.crt  # 受信 CA（P0-2：验证 Kuscia 服务端证书用，替代此前的 InsecureTrustManagerFactory）
      token: config/certs/alice/token

    - domainId: bob
      mode: lite
      host: ${KUSCIA_API_ADDRESS:root-kuscia-lite-bob}
      port: ${KUSCIA_API_PORT:38083}
      protocol: ${KUSCIA_PROTOCOL:tls}
      cert-file: config/certs/bob/client.crt
      key-file: config/certs/bob/client.pem
      ca-file: config/certs/bob/ca.crt  # 受信 CA（P0-2：验证 Kuscia 服务端证书用，替代此前的 InsecureTrustManagerFactory）
      token: config/certs/bob/token
